services:
  postgres:
    image: postgres:16
    container_name: office-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: office
      POSTGRES_USER: office
      POSTGRES_PASSWORD: office_dev_only
    ports:
      - "5433:5432"
    volumes:
      - office-api-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U office -d office"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  office-api-postgres-data:
