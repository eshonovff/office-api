# Файли МУСТАҚИЛИ сайти office.nizom.tj — ҳеҷ гоҳ бо файли дигари
# /etc/nginx/sites-available/ (аз ҷумла nizom.tj-и мавҷуда) омехта нашавад.
#
# Насб:
#   sudo cp deploy/nginx/office.nizom.tj.conf /etc/nginx/sites-available/office.nizom.tj
#   sudo ln -s /etc/nginx/sites-available/office.nizom.tj /etc/nginx/sites-enabled/office.nizom.tj
#   sudo nginx -t && sudo systemctl reload nginx
#
# Баъд SSL (қадами certbot дар runbook ин файлро худкор бо блоки
# "listen 443 ssl" пурра мекунад — дасти дигар лозим нест):
#   sudo certbot --nginx -d office.nizom.tj

server {
    listen 80;
    listen [::]:80;
    server_name office.nizom.tj;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR (BoardHub/InboxHub) — WebSocket upgrade лозим.
    location /hubs/ {
        proxy_pass http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
